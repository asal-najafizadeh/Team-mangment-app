# برای Nginx server
# این فایل را در پوشه nginx config قرار دهید

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # برای SPA: همه route ها را به index.html redirect کن
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

